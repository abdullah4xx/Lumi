name: Build and verify Lumi packages

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/release.yml"
      - "build/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "tools/icon-studio/**"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-pil python3-pytest dpkg
      - name: Install Node dependencies
        run: npm ci
      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest -q tests
      - name: Test Electron GitHub update checks
        run: npm run test:electron-updates
      - name: Verify application versions match
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PYTHON_VERSION="$(PYTHONPATH=src python3 -c 'from lumi import __version__; print(__version__)')"
          if [ "$PACKAGE_VERSION" != "$PYTHON_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match Lumi's Python version ($PYTHON_VERSION)"
            exit 1
          fi
      - name: Read application version
        id: app-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build Debian and AppImage packages
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-linux-${{ steps.app-version.outputs.version }}
          path: |
            artifacts/releases/${{ steps.app-version.outputs.version }}/*.deb
            artifacts/releases/${{ steps.app-version.outputs.version }}/*.AppImage
            artifacts/releases/${{ steps.app-version.outputs.version }}/latest-linux.yml
          if-no-files-found: error
      - name: Publish new app version to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.app-version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists; existing release assets were left unchanged."
            exit 0
          fi
          RELEASE_DIR="artifacts/releases/${VERSION}"
          gh release create "$TAG" \
            "$RELEASE_DIR"/*.deb \
            "$RELEASE_DIR"/*.AppImage \
            "$RELEASE_DIR"/latest-linux.yml \
            --target "$GITHUB_SHA" \
            --title "Lumi $VERSION" \
            --generate-notes
