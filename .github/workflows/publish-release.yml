name: Publish Lumi release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-pil python3-pytest dpkg
      - name: Install Node dependencies
        run: npm ci
      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest -q tests
      - name: Build Debian and AppImage packages
        run: npm run dist -- --publish never
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-electron/*.deb \
            dist-electron/*.AppImage \
            dist-electron/latest-linux.yml \
            --title "Lumi $GITHUB_REF_NAME" \
            --generate-notes
